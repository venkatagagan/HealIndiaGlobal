name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------------------------------
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          # CI-only throwaway credentials (the role is a superuser inside the ephemeral container, so the
          # test suite can create/drop its per-session databases and extensions).
          POSTGRES_USER: hig_ci
          POSTGRES_PASSWORD: hig_ci_only_password
          POSTGRES_DB: hig_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hig_ci -d hig_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://hig_ci:hig_ci_only_password@127.0.0.1:5432/hig_ci
      REDIS_URL: ""
      ANTHROPIC_API_KEY: ""
      PAYMENT_GATEWAYS_ENABLED: mock,bank_transfer,razorpay,stripe
      EMAIL_BACKEND: console
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: ./storage
      RUN_WORKER_IN_API: "false"
      LOG_LEVEL: WARNING
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.lock.txt

      - name: Generate ephemeral secrets
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(python -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Exactly the pinned versions (universal lock), then the app itself without re-resolving (SEC-052).
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e .

      - name: Ruff
        run: python -m ruff check app tests

      - name: Alembic migrations apply cleanly
        run: python -m alembic upgrade head

      - name: Pytest
        run: python -m pytest -q --cov=app --cov-report=xml --junitxml=junit.xml

      # Patient-safety gate (evals/README.md): the rules triage engine must flag 100% of the benchmark's
      # red-flag emergencies and return schema-valid results. `testpaths = ["tests"]`, so name it explicitly.
      # Pure Python - no database, network or Claude calls.
      - name: Screening rules-engine eval gate
        run: python -m pytest -q evals/test_rules_engine_gate.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/junit.xml
            backend/coverage.xml
          if-no-files-found: ignore

  # -----------------------------------------------------------------------------------------------------
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Translation catalogs (web and mobile ARB - every key and placeholder in every language; exports current)
        working-directory: .
        run: |
          node scripts/i18n/check-catalogs.mjs
          node scripts/i18n/export-catalogs.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/apps/*/dist
          retention-days: 7

  # -----------------------------------------------------------------------------------------------------
  website:
    name: Website (lint + typecheck + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No API in CI: static generation uses the bundled fallback catalogue (as in the image build).
      SITE_REQUIRE_LIVE_DATA: "false"
      DATA_FALLBACK: auto
      API_BASE_URL: http://127.0.0.1:9/api/v1
      NEXT_PUBLIC_SITE_URL: https://healindiaglobal.ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # -----------------------------------------------------------------------------------------------------
  terraform:
    name: Terraform (fmt + validate, no AWS access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Format
        run: terraform fmt -check -recursive deploy/terraform

      - name: Validate
        run: |
          for root in deploy/terraform/aws deploy/terraform/aws-starter; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

  # -----------------------------------------------------------------------------------------------------
  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  # -----------------------------------------------------------------------------------------------------
  docker:
    name: Docker images (build only, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, web, website]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: |
          cp infra/.env.example infra/.env
          # Fill the required secrets with throwaway values just for `config` validation.
          sed -i \
            -e "s/^JWT_SECRET=.*/JWT_SECRET=ci-validate-only-0123456789abcdef0123456789/" \
            -e "s/^FIELD_ENCRYPTION_KEY=.*/FIELD_ENCRYPTION_KEY=Y2ktdmFsaWRhdGUtb25seS0wMTIzNDU2Nzg5YWJjZGU=/" \
            infra/.env
          docker compose -f infra/docker-compose.yml --env-file infra/.env config --quiet
          docker compose -f infra/docker-compose.yml --env-file infra/.env --profile s3 config --quiet
          rm infra/.env

      - name: Validate the AWS starter compose override
        run: |
          cat > /tmp/aws.env <<'ENV'
          IMAGE_TAG=ci
          API_IMAGE=example.invalid/hig/api
          WEB_IMAGE=example.invalid/hig/web
          WEBSITE_IMAGE=example.invalid/hig/website
          SITE_DOMAIN=healindiaglobal.ai
          STAFF_HOST=ops.healindiaglobal.ai
          STAFF_CONSOLE_ORIGIN=https://ops.healindiaglobal.ai
          CERTBOT_EMAIL=ci@example.invalid
          AWS_REGION=us-east-2
          DB_HOST=db.example.invalid
          POSTGRES_PASSWORD=unused
          APP_DB_PASSWORD=ci
          MIGRATOR_DB_PASSWORD=ci
          REDIS_PASSWORD=ci
          JWT_SECRET=ci-validate-only-0123456789abcdef0123456789
          FIELD_ENCRYPTION_KEY=Y2ktdmFsaWRhdGUtb25seS0wMTIzNDU2Nzg5YWJjZGU=
          ENV
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.aws.yml --env-file /tmp/aws.env \
            --profile certbot config --quiet

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: false
          tags: healindia/api:ci-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: false
          load: false
          tags: healindia/web:ci-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build website image
        uses: docker/build-push-action@v6
        with:
          context: website
          file: infra/website/Dockerfile
          push: false
          load: false
          tags: healindia/website:ci-${{ github.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

      - name: Lint edge nginx config (base, and with the AWS starter staff-console host)
        run: |
          mkdir -p /tmp/edge/certs /tmp/edge/conf.d /tmp/edge/extra
          for f in infra/nginx/aws/*.conf.in; do
            awk '/^__STAFF_ALLOW__$/ { print "    allow 203.0.113.0/24;"; print "    deny all;"; next }
                 { gsub(/__STAFF_HOST__/, "ops.healindiaglobal.ai"); print }' "$f" \
              > "/tmp/edge/extra/$(basename "$f" .in)"
          done
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" \
            -keyout /tmp/edge/certs/privkey.pem -out /tmp/edge/certs/fullchain.pem 2>/dev/null
          docker run --rm \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 --add-host website:127.0.0.1 \
            -e SITE_DOMAIN=localhost \
            -e NGINX_ENVSUBST_FILTER='_DOMAIN$' \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v /tmp/edge/certs:/etc/nginx/certs:ro \
            nginx:1.27-alpine sh -c '/docker-entrypoint.sh nginx -t'
          docker run --rm \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 --add-host website:127.0.0.1 \
            -e SITE_DOMAIN=healindiaglobal.ai \
            -e NGINX_ENVSUBST_FILTER='_DOMAIN$' \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            -v /tmp/edge/certs:/etc/nginx/certs:ro \
            -v /tmp/edge/extra:/etc/nginx/extra.d:ro \
            nginx:1.27-alpine sh -c '/docker-entrypoint.sh nginx -t'

  # -----------------------------------------------------------------------------------------------------
  # The AWS starter runs on Graviton: make sure every image also builds for linux/arm64 (QEMU emulation).
  docker-arm64:
    name: Docker images linux/arm64 (${{ matrix.image }}, build only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
            file: backend/Dockerfile
          - image: web
            context: web
            file: web/Dockerfile
          - image: website
            context: website
            file: infra/website/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: false
          load: false
          tags: healindia/${{ matrix.image }}:ci-arm64-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-arm64
