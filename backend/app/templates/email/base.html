<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
</head>
<body dir="{{ dir }}" style="margin:0;padding:0;background:#F8FAFC;font-family:Inter,Segoe UI,Tahoma,Helvetica,Arial,sans-serif;color:#0F172A;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F8FAFC;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" dir="{{ dir }}" style="max-width:600px;width:100%;background:#FFFFFF;border-radius:12px;overflow:hidden;border:1px solid #E2E8F0;">
          <tr>
            <td style="background:linear-gradient(90deg,#7B2FF7,#2563EB,#06B6D4);background-color:#2563EB;padding:24px 32px;color:#FFFFFF;text-align:{{ 'right' if dir == 'rtl' else 'left' }};">
              <div style="font-size:20px;font-weight:700;" dir="ltr">{{ app_name }}</div>
              <div style="font-size:13px;opacity:.9;">{{ tagline }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;font-size:15px;line-height:1.6;text-align:{{ 'right' if dir == 'rtl' else 'left' }};">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #E2E8F0;font-size:12px;color:#64748B;text-align:{{ 'right' if dir == 'rtl' else 'left' }};">
              {% block footer %}
              {{ t('email.common.footer_reason') }}
              {% set support_link %}<a href="mailto:{{ support_email }}" dir="ltr" style="color:#2563EB;">{{ support_email }}</a>{% endset %}
              {{ t('email.common.footer_questions', email='@@EMAIL@@') | e | replace('@@EMAIL@@', support_link) }}
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
