# EXAMPLE - External Secrets Operator (https://external-secrets.io) syncing `hig-secrets` from AWS Secrets
# Manager entries created by deploy/terraform/aws/secrets.tf (names hig/<environment>/<KEY>).
# Not referenced by the kustomizations: copy into your overlay (or GitOps repo) and adjust the environment.
# API version: external-secrets.io/v1 (ESO >= 0.17); use v1beta1 on older operators.
#
# The operator's service account needs secretsmanager:GetSecretValue on arn:aws:secretsmanager:ap-south-1:
# <account>:secret:hig/production/* and kms:Decrypt on the secrets KMS key (IRSA or EKS Pod Identity).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-ap-south-1
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hig-secrets
  namespace: hig-production
  labels:
    hig.io/phase: pre-deploy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-ap-south-1
  target:
    name: hig-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: hig/production/DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: hig/production/REDIS_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: hig/production/JWT_SECRET
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef:
        key: hig/production/FIELD_ENCRYPTION_KEY
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: hig/production/RAZORPAY_KEY_ID
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: hig/production/RAZORPAY_KEY_SECRET
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: hig/production/RAZORPAY_WEBHOOK_SECRET
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: hig/production/ANTHROPIC_API_KEY
    - secretKey: SMTP_USER
      remoteRef:
        key: hig/production/SMTP_USER
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: hig/production/SMTP_PASSWORD
    # Shared by api/worker and the website (on-demand ISR revalidation).
    - secretKey: REVALIDATE_SECRET
      remoteRef:
        key: hig/production/REVALIDATE_SECRET
    # Sign in with Apple (only if enabled):
    # - secretKey: APPLE_PRIVATE_KEY
    #   remoteRef:
    #     key: hig/production/APPLE_PRIVATE_KEY
    # Stripe (only if enabled):
    # - secretKey: STRIPE_SECRET_KEY
    #   remoteRef:
    #     key: hig/production/STRIPE_SECRET_KEY
    # - secretKey: STRIPE_PUBLISHABLE_KEY
    #   remoteRef:
    #     key: hig/production/STRIPE_PUBLISHABLE_KEY
    # - secretKey: STRIPE_WEBHOOK_SECRET
    #   remoteRef:
    #     key: hig/production/STRIPE_WEBHOOK_SECRET
