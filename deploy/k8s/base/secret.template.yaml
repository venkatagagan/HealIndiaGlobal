# TEMPLATE ONLY - not referenced by any kustomization and never to be committed with real values.
#
# The api, worker and migrate pods read every key below from the Secret `hig-secrets` (envFrom); the website
# pods read only REVALIDATE_SECRET (secretKeyRef). Preferred:
# sync it from AWS Secrets Manager with External Secrets Operator (external-secret.example.yaml). Manual
# alternative (values never touch git):
#
#   kubectl -n hig-production create secret generic hig-secrets --from-env-file=./secrets.env
#   # secrets.env lives outside the repository, chmod 600, deleted afterwards
#
# Generate:
#   JWT_SECRET            python -c "import secrets; print(secrets.token_urlsafe(48))"
#   FIELD_ENCRYPTION_KEY  python -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
#                         (irrecoverable data key: escrow it; never rotate without a re-encryption migration)
apiVersion: v1
kind: Secret
metadata:
  name: hig-secrets
  labels:
    app.kubernetes.io/part-of: heal-india-global
    hig.io/phase: pre-deploy
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://healindia:REPLACE_ME@REPLACE_DB_HOST:5432/healindia?ssl=require"
  REDIS_URL: "rediss://:REPLACE_ME@REPLACE_REDIS_HOST:6379/0"
  JWT_SECRET: "REPLACE_ME"
  FIELD_ENCRYPTION_KEY: "REPLACE_ME"
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_ME"
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  ANTHROPIC_API_KEY: "REPLACE_ME"
  SMTP_USER: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
  # Sign in with Apple private key (PKCS#8 PEM, \n-escaped); empty when Apple sign-in is not used.
  APPLE_PRIVATE_KEY: ""
  # On-demand website revalidation, shared by api/worker (sender) and hig-website (receiver). At least 32
  # random characters: python -c "import secrets; print(secrets.token_urlsafe(32))". Empty = off.
  REVALIDATE_SECRET: "REPLACE_ME"
  # Only when not using IRSA / EKS Pod Identity for the documents bucket:
  # S3_ACCESS_KEY_ID: "REPLACE_ME"
  # S3_SECRET_ACCESS_KEY: "REPLACE_ME"
