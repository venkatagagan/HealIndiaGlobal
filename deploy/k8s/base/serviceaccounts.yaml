# Dedicated service accounts. Tokens are not mounted (the app never calls the Kubernetes API). On EKS, the
# overlays annotate hig-api / hig-worker for IRSA (S3 documents bucket access, see deploy/k8s/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hig-api
  labels:
    app.kubernetes.io/name: hig-api
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hig-worker
  labels:
    app.kubernetes.io/name: hig-worker
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hig-migrate
  labels:
    app.kubernetes.io/name: hig-migrate
    app.kubernetes.io/component: migrate
    hig.io/phase: pre-deploy
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hig-web
  labels:
    app.kubernetes.io/name: hig-web
    app.kubernetes.io/component: web
automountServiceAccountToken: false
