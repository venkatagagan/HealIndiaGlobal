# Optional: serves the four SPAs from the cluster using web/Dockerfile (nginx; 8081 patient, 8082 agent,
# 8083 hospital, 8084 admin; /healthz on each). Alternatively publish the SPAs to S3 + CloudFront (see
# deploy/README.md) and route only /api to the cluster.
# Runs nginx as its unprivileged user (101) with a read-only root filesystem; writable cache/pid/tmp dirs are
# emptyDirs. Security headers / CSP are added by the ingress controller (ingress-nginx/controller-config).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hig-web
  labels:
    app.kubernetes.io/name: hig-web
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hig-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hig-web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: hig-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hig-web
      containers:
        - name: web
          image: hig-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: patient
              containerPort: 8081
              protocol: TCP
            - name: agent
              containerPort: 8082
              protocol: TCP
            - name: hospital
              containerPort: 8083
              protocol: TCP
            - name: admin
              containerPort: 8084
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: patient
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: patient
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
