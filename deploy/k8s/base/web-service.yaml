apiVersion: v1
kind: Service
metadata:
  name: hig-web
  labels:
    app.kubernetes.io/name: hig-web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hig-web
  ports:
    - name: patient
      port: 8081
      targetPort: patient
      protocol: TCP
    - name: agent
      port: 8082
      targetPort: agent
      protocol: TCP
    - name: hospital
      port: 8083
      targetPort: hospital
      protocol: TCP
    - name: admin
      port: 8084
      targetPort: admin
      protocol: TCP
