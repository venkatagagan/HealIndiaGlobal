# Background job runner + periodic scheduler (python -m app.worker). Jobs are claimed with
# FOR UPDATE SKIP LOCKED, so several replicas are safe; stale locks are re-queued by the worker itself.
# No HTTP endpoint -> no probes; Kubernetes restarts the container if the process exits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hig-worker
  labels:
    app.kubernetes.io/name: hig-worker
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: hig-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hig-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: hig-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Running jobs get time to finish (task timeout in the app is 15 min; longer jobs are re-queued).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hig-worker
      containers:
        - name: worker
          image: hig-api
          imagePullPolicy: IfNotPresent
          # `args` keeps the image entrypoint (tini + docker-entrypoint.sh).
          args: ["python", "-m", "app.worker", "--concurrency", "4"]
          envFrom:
            - configMapRef:
                name: hig-config
            - secretRef:
                name: hig-secrets
          env:
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
