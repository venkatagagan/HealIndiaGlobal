apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hig-tls
spec:
  secretName: hig-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - staging.healindiaglobal.ai
    - agent.staging.healindiaglobal.ai
    - hospital.staging.healindiaglobal.ai
    - ops.staging.healindiaglobal.ai
    - api.staging.healindiaglobal.ai
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
