# Public website (Next.js, hig-website) at the root of the main domain. Next.js sets its own Cache-Control
# (ISR pages: s-maxage + stale-while-revalidate) and robots headers; the controller passes them through.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hig-website
  labels:
    app.kubernetes.io/name: hig-website
    app.kubernetes.io/component: website
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.healindia.example
      secretName: hig-tls
  rules:
    - host: staging.healindia.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hig-website
                port:
                  name: http
---
# Patient portal SPA under /app/ on the main domain (Vite base /app/; the web image serves it from its root, so
# the prefix is stripped). Never indexed (X-Robots-Tag). Note: use-regex applies to every path of this host;
# the plain prefixes of the other Ingresses keep working as anchored regexes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hig-web-patient
  labels:
    app.kubernetes.io/name: hig-web
    app.kubernetes.io/component: web
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/custom-headers: hig-staging/hig-noindex-headers
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.healindia.example
      secretName: hig-tls
  rules:
    - host: staging.healindia.example
      http:
        paths:
          - path: /app(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: hig-web
                port:
                  name: patient
---
# Agent and hospital portal SPAs (optional hig-web Deployment; remove if the SPAs are hosted on S3 + CloudFront).
# Never indexed: every response carries X-Robots-Tag: noindex, nofollow.
