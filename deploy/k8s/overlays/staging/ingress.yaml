# ingress-nginx routing for staging (IngressClass "nginx"). Mirrors infra/nginx/snippets/app-locations.conf:
# every SPA hostname reaches the API same-origin under /api (the refresh cookie is Path=/api/v1/auth,
# SameSite=Strict) and api.<domain> serves the Flutter app and payment webhooks. ingress-nginx merges all
# Ingresses of a host into one server block; the longest matching path wins, so the specific Ingresses below
# override timeouts / limits of the generic /api one. TLS: certificate.yaml (secret hig-tls).
#
# Rate limits are per client IP: keep the controller's `use-forwarded-headers: "false"` unless it sits behind
# a trusted L7 proxy, and preserve client IPs at the load balancer (proxy protocol or
# externalTrafficPolicy: Local) - see deploy/k8s/ingress-nginx/controller-config.example.yaml.
#
# Note: the community ingress-nginx project is retired (best-effort maintenance ended March 2026). The same
# routing maps 1:1 onto Gateway API HTTPRoutes or the F5 NGINX Ingress Controller if you migrate.
---
# API (generic): 20 MB bodies, 60 s timeouts, 20 req/s per IP (burst 60). /health only on the api host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hig-api
  labels:
    app.kubernetes.io/name: hig-api
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.healindia.example
        - agent.staging.healindia.example
        - hospital.staging.healindia.example
        - admin.staging.healindia.example
        - api.staging.healindia.example
      secretName: hig-tls
  rules:
    - host: api.staging.healindia.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hig-api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: hig-api
                port:
                  name: http
    - host: staging.healindia.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hig-api
                port:
                  name: http
    - host: agent.staging.healindia.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hig-api
                port:
                  name: http
    - host: hospital.staging.healindia.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hig-api
                port:
                  name: http
    - host: admin.staging.healindia.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hig-api
                port:
                  name: http
---
