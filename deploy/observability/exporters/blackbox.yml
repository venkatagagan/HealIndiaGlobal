# prometheus/blackbox_exporter modules (job hig-blackbox in prometheus/prometheus.yml).
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_not_ssl: true
      headers:
        User-Agent: "hig-blackbox/1.0"
