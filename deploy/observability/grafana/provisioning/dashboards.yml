# Grafana dashboard provisioning (/etc/grafana/provisioning/dashboards/). Mount
# deploy/observability/grafana/dashboards/ at the path below.
apiVersion: 1
providers:
  - name: heal-india-global
    folder: Heal India Global
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/heal-india-global
