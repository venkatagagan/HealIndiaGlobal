# Heal India Global - edge reverse proxy (main configuration).
#
# One public domain with path routing (PLAN section 3.1): / -> website (Next.js), /app/ /agent/ /hospital/ /gahi/
# -> the four SPAs, /api/ -> FastAPI (incl. WebSocket). The server block lives in templates/edge.conf.template
# (rendered by the nginx image's envsubst step into /etc/nginx/conf.d/edge.conf; SITE_DOMAIN comes from infra/.env).
# Reusable fragments live in snippets/ and are mounted at /etc/nginx/snippets/.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;
pid  /var/run/nginx.pid;
error_log  /dev/stderr  warn;

events {
    worker_connections  8192;
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Basics -------------------------------------------------------------------------------------
    server_tokens        off;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65s;
    keepalive_requests   1000;
    types_hash_max_size  4096;
    server_names_hash_bucket_size 128;
    reset_timedout_connection on;

    client_max_body_size        20m;     # documents/uploads (backend enforces MAX_UPLOAD_MB itself)
    client_body_buffer_size     256k;
    client_header_timeout       15s;
    client_body_timeout         60s;
    send_timeout                60s;
    large_client_header_buffers 4 16k;

    # ---- Real client IP -----------------------------------------------------------------------------
    # $remote_addr is THE client address for rate limits, logs and the API (proxy-api.conf overwrites
    # X-Forwarded-For with it). By default the edge is internet-facing and trusts no forwarding header; behind a
    # load balancer / CDN list its CIDRs in snippets/real-ip.conf (INTEGRATION_BACKLOG #20).
    include /etc/nginx/snippets/real-ip.conf;

    # ---- Logging (JSON, one line per request; $uri excludes query strings such as ws ?token=...) ----
    log_format json_combined escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"host":"$host","method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream":"$upstream_addr",'
        '"user_agent":"$http_user_agent","referer":"$http_referer"}';
    access_log /dev/stdout json_combined;

    # ---- Compression --------------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript text/csv text/x-component
        application/javascript application/json application/ld+json application/xml application/rss+xml
        application/manifest+json application/vnd.api+json application/problem+json
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
    # Brotli: the official nginx image has no ngx_brotli module. Let the CDN negotiate br (CloudFront and
    # Cloudflare both compress with Brotli; see deploy/README.md "CDN"), or build nginx with ngx_brotli and add:
    #   brotli on; brotli_comp_level 5; brotli_min_length 1024; brotli_types <same list as gzip_types>;

    # ---- Cache-Control for /api/ (snippets/proxy-api.conf) ---------------------------------------
    # Keep what the API sends (only the public catalogue is cacheable); default to no-store; force
    # `private, no-store` for any request with an Authorization header.
    map $upstream_http_cache_control $api_cache_control_default {
        ""       "no-store";
        default  $upstream_http_cache_control;
    }
    map $http_authorization $api_cache_control {
        ""       $api_cache_control_default;
        default  "private, no-store";
    }

    # Content-hashed assets (/_next/static/, /<portal>/assets/): a year, immutable - but only for successful
    # responses, so a CDN never pins a 404/502 seen during a rolling deploy.
    map $status $static_cache_control {
        200      "public, max-age=31536000, immutable";
        206      "public, max-age=31536000, immutable";
        304      "public, max-age=31536000, immutable";
        default  "no-store";
    }

    # ---- TLS defaults (Mozilla "intermediate") ------------------------------------------------------
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:20m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # ---- Rate limiting (first line of defence; the API applies its own per-route / per-user limits) -
    # Pre-auth endpoints are keyed by client IP. Authenticated API calls are keyed per session (the access
    # token's signature) so a hospital or agency office behind one NAT address is not throttled as a single
    # client (INTEGRATION_BACKLOG #35); a generous per-IP ceiling still applies on top, so inventing tokens
    # cannot bypass the limit. Unauthenticated API calls fall back to the per-IP key.
    map $http_authorization $api_client_key {
        default                                                          $binary_remote_addr;
        "~^Bearer\s+[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.(?<jwt_sig>[A-Za-z0-9_-]{16,})$"    "t:$jwt_sig";
    }
    limit_req_zone   $binary_remote_addr zone=auth_zone:10m       rate=60r/m;   # /api/v1/auth/* (except me/refresh)
    limit_req_zone   $binary_remote_addr zone=staff_auth_zone:5m  rate=10r/m;   # /api/v1/auth/staff/* (staff door)
    limit_req_zone   $api_client_key     zone=api_zone:20m        rate=20r/s;   # rest of /api/, per session or IP
    limit_req_zone   $binary_remote_addr zone=api_ip_zone:20m     rate=100r/s;  # per-IP ceiling for /api/
    limit_req_zone   $upload_limit_key   zone=upload_zone:10m     rate=30r/m;   # POST /api/v1/documents
    limit_req_zone   $binary_remote_addr zone=site_zone:10m       rate=30r/s;   # website + SPA shells
    limit_conn_zone  $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status   429;
    limit_conn_status  429;
    limit_req_log_level warn;

    # ---- Proxy defaults (locations override individually; never repeat these inside an include) ----
    proxy_connect_timeout     5s;
    proxy_send_timeout        60s;
    proxy_read_timeout        60s;
    proxy_buffering           on;
    proxy_buffers             16 32k;
    proxy_buffer_size         32k;
    proxy_next_upstream       error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # ---- WebSocket upgrade helper -------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }

    # Only POST to /api/v1/documents counts against the upload zone (empty key = not limited).
    map $request_method $upload_limit_key {
        default  '';
        POST     $api_client_key;
    }

    # ---- Upstreams ----------------------------------------------------------------------------------
    upstream api {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }
    upstream website      { server website:3000 max_fails=3 fail_timeout=10s; keepalive 32; }
    upstream web_patient  { server web:8081; keepalive 16; }
    upstream web_agent    { server web:8082; keepalive 16; }
    upstream web_hospital { server web:8083; keepalive 16; }
    upstream web_admin    { server web:8084; keepalive 16; }

    # Micro-cache for immutable, content-hashed SPA (/<prefix>/assets/) and Next.js (/_next/static/) assets.
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=512m
                     inactive=7d use_temp_path=off;

    # Only our rendered template (the image ships a default.conf welcome server that must not load).
    include /etc/nginx/conf.d/edge.conf;
}
