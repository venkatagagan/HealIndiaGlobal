# Locations of the one public server block (PLAN section 3.1 - one domain, path routing, all same-origin):
#
#   /api/            FastAPI (REST, WebSocket /api/v1/ws, gateway webhooks, health)
#   /app/            patient portal SPA   (web:8081, Vite base /app/)
#   /agent/          agent portal SPA     (web:8082, Vite base /agent/)
#   /hospital/       hospital portal SPA  (web:8083, Vite base /hospital/)
#   /gahi/           staff door + admin console SPA (web:8084, Vite base /gahi/) - noindex, optional allow-list
#   /                public website + public login door (/login, /register, ...) - Next.js (website:3000)
#
# Same origin everywhere, so the refresh cookies (hig_refresh Path=/api/v1/auth, hig_staff_refresh
# Path=/api/v1/auth/staff, SameSite=Strict) work for every portal without CORS.

limit_conn conn_per_ip 100;

# JSON body for edge-level throttling, matching the API error envelope.
error_page 429 = @rate_limited;
location @rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header X-Request-ID $request_id always;
    return 429 '{"error":{"code":"rate_limited","message":"Too many requests, please slow down.","details":null,"request_id":"$request_id"}}';
}

# ==== API ==========================================================================================
# Authenticated calls are limited per session, with a per-IP ceiling (nginx.conf, INTEGRATION_BACKLOG #35).

# Public-door authentication (login/register/forgot-password/MFA): strict per-IP budget against brute force.
location /api/v1/auth/ {
    limit_req zone=auth_zone burst=20 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass http://api;
}
# Staff door (/auth/staff/login, refresh, logout): stricter still; optional network allow-list.
location /api/v1/auth/staff/ {
    include /etc/nginx/snippets/staff-access.conf;
    limit_req zone=staff_auth_zone burst=5 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass http://api;
}
# Session housekeeping called by every page load / token refresh: normal API budget, so many users behind
# one NAT (a hospital or agency office) are not throttled by the brute-force zone.
location = /api/v1/auth/me {
    limit_req zone=api_zone burst=40 nodelay;
    limit_req zone=api_ip_zone burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass http://api;
}
location = /api/v1/auth/refresh {
    limit_req zone=api_zone burst=40 nodelay;
    limit_req zone=api_ip_zone burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass http://api;
}
location = /api/v1/auth/staff/refresh {
    include /etc/nginx/snippets/staff-access.conf;
    limit_req zone=api_zone burst=40 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass http://api;
}

# Realtime: WebSocket upgrade, long-lived connections (token travels in the query string, so per-IP).
location /api/v1/ws {
    limit_req zone=api_ip_zone burst=50 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_buffering  off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://api;
}

# Payment gateway webhooks: never throttled by IP (gateways send bursts from shared ranges); the API
# verifies signatures over the raw body, so the body is passed through untouched.
location /api/v1/payments/webhooks/ {
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_request_buffering on;
    proxy_pass http://api;
}

# Document uploads: POSTs share a tighter per-session budget; streaming downloads are not buffered.
location /api/v1/documents {
    limit_req zone=upload_zone burst=10 nodelay;
    limit_req zone=api_zone burst=40 nodelay;
    limit_req zone=api_ip_zone burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_pass http://api;
}

# CSV exports can stream for a while.
location /api/v1/admin/reports/export {
    limit_req zone=api_zone burst=10 nodelay;
    # Per-IP ceiling too: api_zone is keyed on the token signature, so invented tokens would otherwise get a
    # fresh bucket per request (SEC-062).
    limit_req zone=api_ip_zone burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://api;
}

location /api/ {
    limit_req zone=api_zone burst=40 nodelay;
    limit_req zone=api_ip_zone burst=200 nodelay;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass http://api;
}

# Health endpoints (load balancer / uptime checks). /metrics is internal only (scraped on api:8000).
location /health {
    access_log off;
    include /etc/nginx/snippets/proxy-api.conf;
    proxy_pass http://api;
}
location /metrics {
    return 404;
}

# ==== Portals (SPAs) ===============================================================================
# Each SPA is served from the root of its own port in the web image; the edge strips the prefix
# (proxy_pass with a URI part). The bare prefix redirects to the trailing-slash form.
# SEO: the portals are private apps, so every portal response (shell, routes and assets) carries
# `X-Robots-Tag: noindex, nofollow`; only the public website (/) is indexable. With the header in place no
# robots.txt Disallow is needed (a Disallow would even stop crawlers from seeing the noindex).

# -- patient portal --------------------------------------------------------------------------------
location = /app { return 301 /app/; }
location /app/assets/ {
    include /etc/nginx/snippets/spa-assets.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_patient/assets/;
}
location /app/ {
    include /etc/nginx/snippets/spa-shell.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_patient/;
}

# -- agent portal ----------------------------------------------------------------------------------
location = /agent { return 301 /agent/; }
location /agent/assets/ {
    include /etc/nginx/snippets/spa-assets.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_agent/assets/;
}
location /agent/ {
    include /etc/nginx/snippets/spa-shell.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_agent/;
}

# -- hospital portal -------------------------------------------------------------------------------
location = /hospital { return 301 /hospital/; }
location /hospital/assets/ {
    include /etc/nginx/snippets/spa-assets.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_hospital/assets/;
}
location /hospital/ {
    include /etc/nginx/snippets/spa-shell.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_hospital/;
}

# -- staff door + admin console (never linked publicly, never indexed) ------------------------------
location = /gahi { return 301 /gahi/; }
location /gahi/assets/ {
    include /etc/nginx/snippets/staff-access.conf;
    include /etc/nginx/snippets/spa-assets.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_admin/assets/;
}
location /gahi/ {
    include /etc/nginx/snippets/staff-access.conf;
    include /etc/nginx/snippets/spa-shell-staff.conf;   # strict CSP: no third-party scripts (SEC-022)
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://web_admin/;
}

# ==== Public website (Next.js) =====================================================================
# Content-hashed build output: immutable, cached at the edge and (Cache-Control) by any CDN / browser.
location /_next/static/ {
    limit_req zone=site_zone burst=200 nodelay;
    include /etc/nginx/snippets/proxy-website.conf;
    proxy_cache static_cache;
    proxy_cache_valid 200 7d;
    proxy_cache_key $uri;
    proxy_set_header Accept-Encoding "";
    proxy_cache_use_stale error timeout updating;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $static_cache_control always;   # immutable for 200/206/304, no-store for errors
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://website;
}

# Everything else: marketing pages, the public login door (/login, /register, /forgot-password,
# /reset-password, /verify-email), sitemap/robots, image optimiser. Next.js sets the security headers and CSP.
# Caching: the edge does NOT cache HTML; Next.js's own Cache-Control passes through untouched, so a CDN in front
# follows it: ISR pages send `s-maxage=<revalidate>, stale-while-revalidate`, dynamic and auth-door pages
# `private, no-cache, no-store`. On-demand revalidation (POST /api/revalidate from the backend worker) goes
# to the website container directly, never through this edge (/api/ below is the FastAPI API).
location / {
    limit_req zone=site_zone burst=100 nodelay;
    include /etc/nginx/snippets/proxy-website.conf;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://website;
}
