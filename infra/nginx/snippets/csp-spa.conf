# Content-Security-Policy for the four React SPAs.
# Allows: Razorpay Checkout, Stripe.js, Google Identity Services, Google Fonts, OSM/remote images (https:).
# Tighten further if a gateway is not used; test any change against the checkout flow before deploying.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://js.stripe.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://api.stripe.com https://accounts.google.com/gsi/; frame-src https://api.razorpay.com https://checkout.razorpay.com https://js.stripe.com https://hooks.stripe.com https://accounts.google.com/gsi/; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
