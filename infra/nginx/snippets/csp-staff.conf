# Content-Security-Policy for the staff console (/gahi/, SEC-022).
# No third-party scripts at all (no Razorpay, Stripe or Google sign-in): only the console's own bundle runs, so
# a compromised gateway or Google script cannot execute inside the console. Google Fonts are styles/fonts only.
# connect-src 'self' only: the console talks to its own /api/ and /api/v1/ws (wss: same host).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
