# Common proxy settings for requests forwarded to the FastAPI upstream.
proxy_http_version 1.1;
# Empty for normal requests (keeps upstream keepalive), "upgrade" for WebSocket handshakes.
proxy_set_header   Connection         $connection_upgrade;
proxy_set_header   Host               $host;
# Client address: OVERWRITE (never append to) X-Forwarded-For, so a client-supplied header can never become the
# address the API uses for rate limits and audit logs (INTEGRATION_BACKLOG #20). $remote_addr is the real client
# (see snippets/real-ip.conf when a trusted load balancer sits in front of this edge).
proxy_set_header   X-Real-IP          $remote_addr;
proxy_set_header   X-Forwarded-For    $remote_addr;
proxy_set_header   X-Forwarded-Proto  $scheme;
proxy_set_header   X-Forwarded-Host   $host;
proxy_set_header   Forwarded          "";
proxy_set_header   X-Request-ID       $request_id;
# The API sets its own security headers (nosniff, frame DENY, CSP); the edge only guarantees HSTS
# (the API echoes its own X-Request-ID, derived from the header we forward).
proxy_hide_header  Strict-Transport-Security;
proxy_hide_header  X-Powered-By;
# Caching (nginx.conf maps): the API decides. Only the public catalogue sends `public, max-age=300, ...` with an
# ETag; a response without Cache-Control becomes `no-store`, and any request carrying Authorization gets
# `private, no-store`, so neither this edge nor a CDN ever stores an authenticated or personal response.
proxy_hide_header  Cache-Control;
add_header Cache-Control $api_cache_control always;
# JSON API responses are never search results.
add_header X-Robots-Tag "noindex, nofollow" always;
proxy_hide_header  Server;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
