# Real client IP (included in the http block of nginx.conf). INTEGRATION_BACKLOG #20.
#
# Default: the edge is the internet-facing hop, so $remote_addr already is the client and NO forwarding header
# from the client is trusted. The edge then sends the API exactly one hop (X-Forwarded-For: $remote_addr, see
# proxy-api.conf), and the API trusts proxy headers only from the edge's fixed address (FORWARDED_ALLOW_IPS).
#
# Only if this edge sits behind a load balancer / CDN that you control, uncomment and list ITS address ranges
# (never 0.0.0.0/0). nginx then walks X-Forwarded-For from the right and stops at the first untrusted address,
# so a client-supplied X-Forwarded-For value can never become $remote_addr.
#
#   set_real_ip_from  10.0.0.0/8;          # e.g. the load balancer subnets of your VPC
#   real_ip_header    X-Forwarded-For;
#   real_ip_recursive on;
#
# Cloudflare example: list https://www.cloudflare.com/ips/ ranges with set_real_ip_from and use
#   real_ip_header CF-Connecting-IP;
