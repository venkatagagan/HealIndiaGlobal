# Security headers for HTML/static responses served by the edge.
# NOTE: nginx drops inherited add_header directives in any block that declares its own, so every
# location that adds headers includes this file explicitly.
add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header X-Frame-Options            "DENY" always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(self), payment=(self \"https://checkout.razorpay.com\" \"https://js.stripe.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header X-Request-ID               $request_id always;
