# Content-hashed Vite build assets (/<prefix>/assets/...): cache for a year and keep a copy at the edge.
# Used inside `location /<prefix>/assets/ { include ...; proxy_pass http://<upstream>/assets/; }`.
limit_req zone=site_zone burst=200 nodelay;
include /etc/nginx/snippets/security-headers.conf;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_cache static_cache;
proxy_cache_valid 200 7d;
proxy_cache_key $uri;                  # includes the /<prefix>/ so the four SPAs never collide
proxy_set_header Accept-Encoding "";   # cache one identity variant; the edge gzips it per client
proxy_cache_use_stale error timeout updating;
proxy_hide_header Cache-Control;
add_header Cache-Control $static_cache_control always;   # immutable for 200/206/304, no-store for errors
add_header X-Cache-Status $upstream_cache_status always;
