# SPA shell of the staff console (/gahi/): like spa-shell.conf but with the strict staff CSP (SEC-022).
#   location /gahi/ { include ...; proxy_pass http://web_admin/; }
limit_req zone=site_zone burst=100 nodelay;
include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/csp-staff.conf;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
