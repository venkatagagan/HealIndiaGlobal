# SPA shell, client-side routes and public files of one portal. The upstream (web image) serves each app from
# its root with an index.html fallback and no-cache on the shell, so the edge strips the /<prefix>/:
#   location /<prefix>/ { include ...; proxy_pass http://<upstream>/; }
limit_req zone=site_zone burst=100 nodelay;
include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/csp-spa.conf;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
