# TLS certificate for the public server blocks.
# Put real certificates (e.g. Let's Encrypt fullchain/privkey) in infra/nginx/certs/; the `certs-init`
# compose service only generates a self-signed pair when these files are missing.
ssl_certificate      /etc/nginx/certs/fullchain.pem;
ssl_certificate_key  /etc/nginx/certs/privkey.pem;

# OCSP stapling works only with CA-issued certificates (harmless warning with self-signed ones).
ssl_stapling         on;
ssl_stapling_verify  on;
resolver             127.0.0.11 valid=300s ipv6=off;   # Docker embedded DNS; replace outside Docker
resolver_timeout     5s;
