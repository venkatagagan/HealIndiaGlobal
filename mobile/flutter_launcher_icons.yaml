# Launcher icons generated from the brand sources in design/icons (PNG export: design/tools/export_png.py).
# Regenerate after changing the artwork:
#   C:\NewProjects\python313\python.exe ..\design\tools\export_png.py --out <tmp>   # then copy <tmp>/launcher/*.png to assets/launcher/
#   dart run flutter_launcher_icons
# Generated files (android/app/src/main/res/mipmap-*, ios/Runner/Assets.xcassets/AppIcon.appiconset) must not be hand-edited.
# assets/launcher/ is intentionally NOT listed under flutter.assets in pubspec.yaml (not bundled into the app).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/launcher/app-icon-1024.png"             # legacy (pre-API 26) Android launcher
  image_path_ios: "assets/launcher/app-icon-ios-1024.png"     # opaque, full-bleed (iOS applies its own mask)
  remove_alpha_ios: true
  adaptive_icon_background: "assets/launcher/app-icon-background-1024.png"
  adaptive_icon_foreground: "assets/launcher/app-icon-foreground-1024.png"
  adaptive_icon_monochrome: "assets/launcher/app-icon-foreground-1024.png"  # Android 13+ themed icon
  min_sdk_android: 21
# Web icons are exported directly into web/ (favicon.svg/png, icons/Icon-*.png), not generated here.
